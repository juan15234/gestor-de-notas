<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestor de notas</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#d9dee8;--accent:#3b6fd4;--ok:#1f8a4c;--bad:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--card:#1e232c;--text:#e8ebf0;--muted:#9aa3b2;--line:#323a47;--accent:#6c95ea;--ok:#4cc27f;--bad:#ef7a6d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171d;--card:#1e232c;--text:#e8ebf0;--muted:#9aa3b2;--line:#323a47;--accent:#6c95ea;--ok:#4cc27f;--bad:#ef7a6d;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
main{max-width:760px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.5rem;margin:0 0 4px}
p.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
input{width:100%;padding:10px 12px;font-size:1rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
input:focus{outline:2px solid var(--accent);border-color:transparent}
button{padding:10px 18px;font-size:1rem;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;margin-top:12px}
button.sec{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.hello{font-size:1.15rem;margin:0}
.student h2{font-size:1rem;margin:0 0 12px;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.res{margin-top:14px;font-weight:600}
.ok{color:var(--ok)}.bad{color:var(--bad)}
small{color:var(--muted)}
@media(max-width:480px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<main>
  <h1>📒 Gestor de notas</h1>
  <p class="sub">Registra las notas de tus estudiantes de forma rápida y sencilla.</p>

  <section class="card" id="login">
    <label for="docente">¿Cómo te llamas, docente?</label>
    <input id="docente" placeholder="Escribe tu nombre" autocomplete="name">
    <button id="entrar">Continuar</button>
  </section>

  <section id="panel" hidden>
    <div class="card">
      <p class="hello" id="saludo"></p>
      <small>Escribe el nombre de cada estudiante y sus 4 notas (de 0 a 5). El promedio se calcula solo. Desempeño: <b>Aprobado</b> con 3.5 o más, <b>Desaprobado</b> con menos de 3.5.</small>
    </div>

    <div id="estudiantes"></div>
    <button class="sec" id="limpiar">Limpiar todo</button>
  </section>
</main>

<script>
(function(){
  var cont=document.getElementById('estudiantes');
  for(var i=1;i<=3;i++){
    var d=document.createElement('div');
    d.className='card student';
    d.dataset.i=i;
    d.innerHTML='<h2>Estudiante '+i+'</h2>'+
      '<label>Nombre del estudiante</label>'+
      '<input class="nombre" placeholder="Nombre completo">'+
      '<div class="grid">'+
      [1,2,3,4].map(function(n){return '<div><label>Nota '+n+'</label><input class="nota" type="number" min="0" max="5" step="0.1" inputmode="decimal" placeholder="0.0"></div>';}).join('')+
      '</div><div class="res"></div>';
    cont.appendChild(d);
  }

  function calcular(card){
    var vals=[].slice.call(card.querySelectorAll('.nota')).map(function(x){return x.value===''?null:parseFloat(x.value);});
    var res=card.querySelector('.res');
    var hay=vals.filter(function(v){return v!==null&&!isNaN(v);});
    if(!hay.length){res.textContent='';return;}
    if(hay.some(function(v){return v<0||v>5;})){res.innerHTML='<span class="bad">Las notas deben estar entre 0 y 5.</span>';return;}
    var prom=hay.reduce(function(a,b){return a+b;},0)/hay.length;
    var completo=hay.length===4;
    var estado=prom>=3.5?'<span class="ok">✔ Aprobado</span>':'<span class="bad">✘ Desaprobado</span>';
    res.innerHTML='Promedio: '+prom.toFixed(2)+(completo?' — '+estado:' <small>(faltan notas)</small>');
  }

  cont.addEventListener('input',function(e){
    var card=e.target.closest('.student');
    if(card)calcular(card);
  });

  function entrar(){
    var n=document.getElementById('docente').value.trim();
    if(!n){document.getElementById('docente').focus();return;}
    document.getElementById('saludo').textContent='👋 Bienvenido(a), docente '+n+'.';
    document.getElementById('login').hidden=true;
    document.getElementById('panel').hidden=false;
  }
  document.getElementById('entrar').onclick=entrar;
  document.getElementById('docente').addEventListener('keydown',function(e){if(e.key==='Enter')entrar();});

  document.getElementById('limpiar').onclick=function(){
    cont.querySelectorAll('input').forEach(function(x){x.value='';});
    cont.querySelectorAll('.res').forEach(function(x){x.textContent='';});
  };
})();
</script>
</body>
</html>
